name: Vint

on: [push, pull_request]

jobs:
  vint:
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Set up Python
      uses: actions/setup-python@v1
      with:
        python-version: 3.10.19 
    - name: Setup dependencies
      run: pip install vim-vint
    - name: Run Vimscript Linter
      # folding9.vim is vim9script. vint 0.3.21 does not finish parsing it.
      run: find . -name '*.vim' ! -name 'folding9.vim' -print0 | xargs -0 vint
